<text x="55" y="780" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">As linhas representam pares de tabelas relacionados; uma mesma conexão pode conter várias FKs de calendário.</text>
<text x="55" y="815" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Fonte: constraints PK/FK consultadas diretamente no PostgreSQL · inteligencia_receita_db · schema gold</text>
<text x="55" y="850" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Chaves, atributos e regras permanecem inalterados. Diagrama de documentação.</text>
